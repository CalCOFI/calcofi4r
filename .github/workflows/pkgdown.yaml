# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::DiagrammeRsvg, local::.
          needs: website

      # Smoke test, permanent. The vignettes set warning = FALSE / message = FALSE,
      # so a cc_get_db() that hands back an EMPTY database (every remote view
      # failed to bind) surfaces only as "Table 'obs' not found" a few chunks
      # later, with nothing in the log saying why. This runs the same connect
      # with warnings printed as they happen, and fails the run here.
      - name: Smoke test cc_get_db()
        run: |
          Rscript -e '
            options(warn = 1)
            cat("duckdb", as.character(packageVersion("duckdb")), "\n")
            con <- calcofi4r::cc_get_db()
            print(DBI::dbListTables(con))
            stopifnot("obs" %in% DBI::dbListTables(con))'

      # No continue-on-error. It was here, and it turned a broken build into a
      # green tick: pkgdown writes articles/index.html (the navbar) BEFORE
      # rendering the articles themselves, so when one vignette failed the site
      # deployed listing every article and serving only the ones built before the
      # failure. The symptom is a 404 from a link in your own navbar, and nothing
      # anywhere says so.
      #
      # A failed build must fail the run — the deploy step below is then skipped,
      # which is right: better to keep serving the last good site than to publish
      # a half-built one.
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          clean: true   # stale files (an old favicon set, an unreferenced lightswitch.js) accumulated for months under clean: false
          branch: gh-pages
          folder: docs
